<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 · 水果销售系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1e2440 0%, #312e81 55%, #4f46e5 100%);
            position: relative;
            overflow: hidden;
        }
        body::before, body::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            filter: blur(2px);
            opacity: .25;
        }
        body::before { width: 420px; height: 420px; background: #8b5cf6; top: -140px; left: -120px; }
        body::after { width: 360px; height: 360px; background: #0ea5e9; bottom: -130px; right: -100px; opacity: .18; }

        .card {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, .97);
            width: 400px;
            padding: 42px 38px 34px;
            border-radius: 18px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, .35);
        }
        .logo-row { text-align: center; margin-bottom: 8px; }
        .logo-badge {
            width: 62px; height: 62px;
            margin: 0 auto 14px;
            border-radius: 18px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            display: flex; align-items: center; justify-content: center;
            font-size: 30px;
            box-shadow: 0 10px 24px rgba(99, 102, 241, .45);
        }
        .card h1 { font-size: 22px; color: #1f2937; }
        .card .sub { font-size: 12px; color: #9ca3af; letter-spacing: 2px; margin-top: 4px; }

        .error-box {
            background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c;
            padding: 10px 14px; border-radius: 10px; font-size: 13px;
            margin: 22px 0 0;
        }
        .field { margin-top: 18px; }
        .field label { display: block; font-size: 13px; color: #4b5563; font-weight: 600; margin-bottom: 7px; }
        .field input {
            width: 100%; padding: 12px 14px;
            border: 1.5px solid #e5e7eb; border-radius: 10px;
            font-size: 14px; outline: none; transition: all .15s;
        }
        .field input:focus { border-color: #6366f1; box-shadow: 0 0 0 4px rgba(99,102,241,.12); }
        .btn-login {
            width: 100%; margin-top: 24px;
            padding: 12px;
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: #fff; border: none; border-radius: 10px;
            font-size: 15px; font-weight: 600; letter-spacing: 4px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(79, 70, 229, .38);
            transition: transform .15s;
        }
        .btn-login:hover { transform: translateY(-2px); }
        .btn-login:disabled { opacity: .6; cursor: wait; transform: none; }
        .tip {
            margin-top: 16px; padding: 10px 12px;
            background: #f0f5ff; border: 1px solid #dbe4ff; border-radius: 10px;
            font-size: 12px; color: #6b7280; line-height: 1.7;
        }
        .tip b { color: #4f46e5; }

        /* 欢迎回来面板 */
        #panel-welcome { display: none; text-align: center; }
        .hello { margin-top: 20px; font-size: 15px; color: #374151; }
        .hello b { color: #4f46e5; font-size: 17px; }
        .role-badge {
            display: inline-block; margin-top: 10px;
            padding: 4px 14px; border-radius: 999px;
            font-size: 12px; font-weight: 600;
        }
        .role-admin { background: #fff4ed; color: #ea580c; }
        .role-user { background: #ecfdf5; color: #059669; }
        .status-line {
            margin-top: 18px; padding: 12px; border-radius: 10px;
            font-size: 13px; line-height: 1.7;
        }
        .st-checking { background: #f3f4f6; color: #6b7280; }
        .st-up { background: #ecfdf5; color: #047857; }
        .st-down { background: #fffbeb; color: #b45309; }
        .btn-enter {
            display: block; width: 100%; margin-top: 18px;
            padding: 12px; text-align: center; text-decoration: none;
            background: linear-gradient(135deg, #ff9000, #ff5000);
            color: #fff; border: none; border-radius: 10px;
            font-size: 15px; font-weight: 600; letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(255, 80, 0, .35);
            transition: transform .15s, opacity .15s;
        }
        .btn-enter:hover { transform: translateY(-2px); }
        .btn-enter:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }
        .btn-switch {
            display: inline-block; margin-top: 16px;
            font-size: 13px; color: #6b7280; text-decoration: underline; cursor: pointer;
        }
        .btn-switch:hover { color: #4f46e5; }
        .save-note { margin-top: 18px; font-size: 12px; color: #9ca3af; }
    </style>
</head>
<body>

<!-- 登录面板 -->
<div class="card" id="panel-login">
    <div class="logo-row">
        <div class="logo-badge">🍓</div>
        <h1>水果销售系统</h1>
        <div class="sub">FRUIT SHOP · 快捷登录</div>
    </div>
    <div class="error-box" id="err" style="display:none"></div>
    <form id="loginForm">
        <div class="field">
            <label for="username">用户名</label>
            <input type="text" id="username" placeholder="请输入用户名" autocomplete="off" required autofocus>
        </div>
        <div class="field">
            <label for="password">密码</label>
            <input type="password" id="password" placeholder="请输入密码" required>
        </div>
        <button type="submit" class="btn-login" id="btnLogin">登 录</button>
    </form>
    <div class="tip">
        💡 本页面<b>双击即开、无需启动系统</b>；登录状态将在本机保存 <b>30 天</b>。<br>
        若系统服务正在运行，登录后可一键进入完整功能。
    </div>
</div>

<!-- 欢迎回来面板 -->
<div class="card" id="panel-welcome">
    <div class="logo-row">
        <div class="logo-badge">🍓</div>
        <h1>欢迎回来</h1>
        <div class="sub">FRUIT SHOP · 已保存的登录</div>
    </div>
    <div class="hello">你好，<b id="helloName">-</b></div>
    <div class="role-badge" id="roleBadge">-</div>
    <div class="status-line st-checking" id="statusLine">⏳ 正在检测系统服务是否运行…</div>
    <a class="btn-enter" id="btnEnter" href="#" style="display:none">🚀 进入系统</a>
    <div class="save-note">登录状态已在本机保存 30 天，期间无需重复登录</div>
    <span class="btn-switch" id="btnSwitch">切换账号</span>
</div>

<script>
    // 账号口令的 SHA-256 指纹（页面中不保存明文密码）
    var ACCOUNTS = {
        "admin": { hash: "8d969eef6ecad3c29a3a629280e686cf0c3f5d5a86aff3ca12020c923adc6c92", role: "ADMIN" },
        "user":  { hash: "a665a45920422f9d417e4867efdc4fb8a04a1f3fff1fa07e998e86f7f7a27ae3", role: "USER" }
    };
    var STORE_KEY = "fruitshop_login";
    var SAVE_DAYS = 30;
    var SERVER = "http://localhost:8080";

    function $(id) { return document.getElementById(id); }

    function sha256Hex(text) {
        if (!(window.crypto && window.crypto.subtle)) {
            return Promise.reject(new Error("当前浏览器不支持 SHA-256，请使用新版 Edge / Chrome 打开"));
        }
        var data = new TextEncoder().encode(text);
        return window.crypto.subtle.digest("SHA-256", data).then(function (buf) {
            var arr = new Uint8Array(buf), out = "";
            for (var i = 0; i < arr.length; i++) out += ("0" + arr[i].toString(16)).slice(-2);
            return out;
        });
    }

    function loadSaved() {
        try {
            var raw = localStorage.getItem(STORE_KEY);
            if (!raw) return null;
            var s = JSON.parse(raw);
            if (!s || !s.u || !s.k || !s.exp || s.exp < Date.now()) {
                localStorage.removeItem(STORE_KEY);
                return null;
            }
            return s;
        } catch (e) { return null; }
    }

    function saveLogin(u, role, k) {
        localStorage.setItem(STORE_KEY, JSON.stringify({
            u: u, role: role, k: k, exp: Date.now() + SAVE_DAYS * 24 * 3600 * 1000
        }));
    }

    async function pingBackend() {
        try {
            var ctrl = new AbortController();
            var timer = setTimeout(function () { ctrl.abort(); }, 4000);
            await fetch(SERVER + "/login?_=" + Date.now(), { mode: "no-cors", cache: "no-store", signal: ctrl.signal });
            clearTimeout(timer);
            return true;
        } catch (e) { return false; }
    }

    async function refreshStatus(s) {
        var line = $("statusLine"), enter = $("btnEnter");
        line.className = "status-line st-checking";
        line.textContent = "⏳ 正在检测系统服务是否运行…";
        enter.style.display = "none";
        var up = await pingBackend();
        if (up) {
            line.className = "status-line st-up";
            line.textContent = "✅ 系统服务运行中，点击下方按钮直达（免重复登录）";
            enter.href = SERVER + "/auto-login?u=" + encodeURIComponent(s.u) + "&k=" + encodeURIComponent(s.k);
            enter.style.display = "block";
        } else {
            line.className = "status-line st-down";
            line.innerHTML = "⚠️ 系统服务未启动<br>你的登录已保存 30 天；启动系统后打开本页即可一键进入";
        }
    }

    function showWelcome(s) {
        $("panel-login").style.display = "none";
        $("panel-welcome").style.display = "block";
        $("helloName").textContent = s.u;
        var badge = $("roleBadge");
        if (s.role === "ADMIN") {
            badge.className = "role-badge role-admin";
            badge.textContent = "🏪 卖家中心";
        } else {
            badge.className = "role-badge role-user";
            badge.textContent = "🛍️ 买家中心";
        }
        refreshStatus(s);
    }

    // 初始化：已有保存的登录则直接显示欢迎面板
    (function init() {
        var s = loadSaved();
        if (s) showWelcome(s);
    })();

    // 登录
    $("loginForm").addEventListener("submit", function (e) {
        e.preventDefault();
        var err = $("err");
        err.style.display = "none";
        var u = $("username").value.trim();
        var p = $("password").value;
        var btn = $("btnLogin");
        if (!u || !p) return;

        var acc = ACCOUNTS[u];
        btn.disabled = true;
        btn.textContent = "登录中…";
        sha256Hex(p).then(function (h) {
            if (acc && acc.hash === h) {
                saveLogin(u, acc.role, h);
                showWelcome(loadSaved());
            } else {
                err.textContent = "用户名或密码错误";
                err.style.display = "block";
            }
        }).catch(function (ex) {
            err.textContent = ex.message || "登录失败";
            err.style.display = "block";
        }).finally(function () {
            btn.disabled = false;
            btn.textContent = "登 录";
        });
    });

    // 切换账号
    $("btnSwitch").addEventListener("click", function () {
        localStorage.removeItem(STORE_KEY);
        $("panel-welcome").style.display = "none";
        $("panel-login").style.display = "block";
        $("password").value = "";
    });
</script>
</body>
</html>
