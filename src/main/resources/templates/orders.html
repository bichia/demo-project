<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('我的订单')}"></head>
<body>
<aside th:replace="~{fragments :: sidebar('orders')}"></aside>

<div class="main-wrapper">
    <header th:replace="~{fragments :: topbar('我的订单', '查看订单状态、付款与收货')}"></header>

    <main class="content">
        <div class="flash" th:if="${message}">✅ <span th:text="${message}"></span></div>
        <div class="flash error" th:if="${error}">⚠️ <span th:text="${error}"></span></div>

        <!-- 状态分类 Tab（参考淘宝） -->
        <div class="order-tabs">
            <a th:classappend="${status == null} ? ' active'" th:href="@{/orders}">全部</a>
            <a th:classappend="${status == 'PENDING'} ? ' active'" th:href="@{/orders(status='PENDING')}">待付款</a>
            <a th:classappend="${status == 'PAID'} ? ' active'" th:href="@{/orders(status='PAID')}">待发货</a>
            <a th:classappend="${status == 'SHIPPED'} ? ' active'" th:href="@{/orders(status='SHIPPED')}">待收货</a>
            <a th:classappend="${status == 'COMPLETED'} ? ' active'" th:href="@{/orders(status='COMPLETED')}">已完成</a>
        </div>

        <div th:if="${!orders.isEmpty()}">
            <div class="order-card" th:each="o : ${orders}">
                <div class="order-header">
                    <div class="order-meta">
                        <span class="order-no">订单号：<b th:text="${o.id}">0001</b></span>
                        <span class="order-date" th:text="${#temporals.format(o.createTime, 'yyyy-MM-dd HH:mm:ss')}">2026-01-01 12:00</span>
                    </div>
                    <span class="order-status"
                          th:classappend="${o.status == 'PENDING'} ? ' pending' : (${o.status == 'PAID'} ? ' paid' : (${o.status == 'SHIPPED'} ? ' shipped' : (${o.status == 'COMPLETED'} ? ' completed' : ' cancelled')))">
                        <span th:text="${o.status == 'PENDING' ? '待付款' : (o.status == 'PAID' ? '待发货' : (o.status == 'SHIPPED' ? '待收货' : (o.status == 'COMPLETED' ? '已完成' : '已取消')))}">状态</span>
                    </span>
                </div>
                <div class="order-body">
                    <div class="order-items-list">
                        <div class="order-item-thumb" th:each="oi : ${o.items}">
                            <img th:if="${oi.productImage != null and !oi.productImage.isEmpty()}" th:src="${oi.productImage}" alt=""
                                 onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
                            <span class="cart-thumb-fallback" style="display:none">🍓</span>
                            <span class="order-item-name" th:text="${oi.productName}">水果名</span>
                            <span class="order-item-qty" th:text="'×' + ${oi.quantity}">×1</span>
                        </div>
                    </div>
                    <div class="order-summary">
                        <div class="order-total">
                            <span class="yen">¥</span><span class="num" th:text="${#numbers.formatDecimal(o.totalAmount, 1, 'COMMA', 2, 'POINT')}">0.00</span>
                        </div>
                        <div class="order-actions">
                            <a class="btn btn-ghost btn-sm" th:href="@{'/orders/' + ${o.id}}">订单详情</a>
                            <!-- 待付款：去付款 + 取消 -->
                            <form th:if="${o.status == 'PENDING'}" th:action="@{'/orders/' + ${o.id} + '/pay'}" method="post" class="inline-form">
                                <button type="submit" class="btn btn-primary btn-sm">立即付款</button>
                            </form>
                            <form th:if="${o.status == 'PENDING'}" th:action="@{'/orders/' + ${o.id} + '/cancel'}" method="post" class="inline-form"
                                  onsubmit="return confirm('确定取消此订单吗？');">
                                <button type="submit" class="btn btn-danger btn-sm">取消订单</button>
                            </form>
                            <!-- 待收货：确认收货 -->
                            <form th:if="${o.status == 'SHIPPED'}" th:action="@{'/orders/' + ${o.id} + '/confirm'}" method="post" class="inline-form"
                                  onsubmit="return confirm('确认已收到水果？');">
                                <button type="submit" class="btn btn-primary btn-sm">✅ 确认收货</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="cart-empty" th:if="${orders.isEmpty()}">
            <div class="big">🍓</div>
            <p>暂无相关订单</p>
            <a class="btn btn-primary" th:href="@{/shop}">去逛逛</a>
        </div>
    </main>
</div>
</body>
</html>
