<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('品牌管理')}"></head>
<body>
<aside th:replace="~{fragments :: sidebar('brands')}"></aside>

<div class="main-wrapper">
    <header th:replace="~{fragments :: topbar('品牌管理', '商品品牌的新增、编辑与删除')}"></header>

    <main class="content">
        <div class="flash" th:if="${message}">✅ <span th:text="${message}"></span></div>
        <div class="flash error" th:if="${error}">⚠️ <span th:text="${error}"></span></div>

        <!-- 品牌商品分布可视化 -->
        <div class="viz-card" th:if="${!brandStats.isEmpty()}">
            <div class="card-title"><span class="bar"></span>📊 品牌商品分布图</div>
            <div class="viz-bars">
                <div class="viz-bar-row" th:each="b : ${brandStats}">
                    <span class="v-name">
                        <span th:if="${b.logo != null and !b.logo.isEmpty()}" th:text="${b.logo}">🏷️</span>
                        <span th:if="${b.logo == null or b.logo.isEmpty()}" style="font-weight:700;color:var(--primary)" th:text="${#strings.substring(b.name,0,1)}">B</span>
                        <span th:text="${b.name}">品牌</span>
                    </span>
                    <span class="viz-bar-track">
                        <span class="viz-bar-fill brand-fill" th:style="'width:' + ${b.percent} + '%'" th:text="${b.percent} + '%'">50%</span>
                    </span>
                    <span class="viz-bar-val" th:text="${b.productCount} + ' 件 · 库存' + ${b.stock}">0</span>
                </div>
            </div>
        </div>

        <div class="toolbar">
            <div style="color:var(--text-2);font-size:13px">
                共 <b th:text="${#lists.size(brands)}" style="color:var(--text)">0</b> 个产地品牌
            </div>
            <a class="btn btn-primary" th:if="${loginUser.admin}" th:href="@{/brands/new}">➕ 新增品牌</a>
        </div>

        <div class="cat-grid">
            <div class="cat-card" th:each="b : ${brands}">
                <div class="big-icon">
                    <span th:if="${b.logo != null and !b.logo.isEmpty()}" th:text="${b.logo}">🏷️</span>
                    <span th:if="${b.logo == null or b.logo.isEmpty()}"
                          style="font-size:20px;font-weight:800;color:var(--primary)"
                          th:text="${#strings.substring(b.name,0,1)}">B</span>
                </div>
                <h3 th:text="${b.name}">品牌名</h3>
                <div class="c-desc" th:text="${b.description} ?: '（暂无描述）'">描述</div>
                <div class="c-meta">
                    <span><b th:text="${productCountMap[b.id]} ?: 0">0</b>件商品</span>
                    <span>排序值 <b th:text="${b.sortOrder}">99</b></span>
                </div>
                <div class="c-actions" th:if="${loginUser.admin}">
                    <a class="btn btn-edit btn-sm" th:href="@{/products(brandId=${b.id})}">查看商品</a>
                    <a class="btn btn-ghost btn-sm" th:href="@{'/brands/' + ${b.id} + '/edit'}">✏️ 编辑</a>
                    <form class="inline-form" th:action="@{'/brands/' + ${b.id} + '/delete'}" method="post"
                          onsubmit="return confirm('确定删除品牌「'+this.dataset.name+'」吗？');"
                          th:attr="data-name=${b.name}">
                        <button type="submit" class="btn btn-danger btn-sm">🗑️ 删除</button>
                    </form>
                </div>
                <div class="c-actions" th:unless="${loginUser.admin}">
                    <a class="btn btn-ghost btn-sm" th:href="@{/products(brandId=${b.id})}">查看该品牌商品 →</a>
                </div>
            </div>
        </div>
    </main>
</div>
</body>
</html>
