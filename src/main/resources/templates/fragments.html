<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' · 商品管理系统'">商品管理系统</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<!-- 四宫格图标 SVG 片段 -->
<svg th:fragment="gridIcon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
    <rect x="3" y="3" width="7.5" height="7.5" rx="1.6"/>
    <rect x="13.5" y="3" width="7.5" height="7.5" rx="1.6"/>
    <rect x="3" y="13.5" width="7.5" height="7.5" rx="1.6"/>
    <rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.6"/>
</svg>

<!-- ============ 侧边栏 ============ -->
<aside class="sidebar" th:fragment="sidebar(active)">
    <div class="brand">
        <span class="logo">🍓</span>
        <span>水果销售系统<small>FRUIT SHOP</small></span>
    </div>
    <nav class="nav">
        <!-- ========== 管理员（卖家中心）菜单 ========== -->
        <th:block th:if="${loginUser != null and loginUser.admin}">
            <a class="nav-item" th:classappend="${active == 'dashboard'} ? ' active'" th:href="@{/dashboard}">
                <span class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.6"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.6"/></svg></span>
                <span>卖家工作台</span>
            </a>

            <details class="nav-group" th:open="${active == 'products' || active == 'categories' || active == 'brands'}">
                <summary class="nav-item nav-group-head">
                    <span class="ico">🍓</span>
                    <span>水果管理</span>
                    <span class="chev">⌃</span>
                </summary>
                <div class="nav-sub">
                    <a class="nav-sub-item" th:classappend="${active == 'products'} ? ' active'" th:href="@{/products}">
                        <span class="ico">📦</span>
                        <span>水果列表</span>
                    </a>
                    <a class="nav-sub-item" th:classappend="${active == 'categories'} ? ' active'" th:href="@{/categories}">
                        <span class="ico">🗂️</span>
                        <span>分类管理</span>
                    </a>
                    <a class="nav-sub-item" th:classappend="${active == 'brands'} ? ' active'" th:href="@{/brands}">
                        <span class="ico">🏷️</span>
                        <span>产地品牌</span>
                    </a>
                </div>
            </details>

            <a class="nav-item" th:classappend="${active == 'adminOrders'} ? ' active'" th:href="@{/admin/orders}">
                <span class="ico">📮</span>
                <span>订单管理</span>
            </a>

            <a class="nav-item" th:classappend="${active == 'shop'} ? ' active'" th:href="@{/shop}">
                <span class="ico">👁️</span>
                <span>查看商城前台</span>
            </a>
        </th:block>

        <!-- ========== 普通用户（买家中心）菜单 ========== -->
        <th:block th:if="${loginUser != null and !loginUser.admin}">
            <a class="nav-item" th:classappend="${active == 'shop'} ? ' active'" th:href="@{/shop}">
                <span class="ico">🍓</span>
                <span>商城首页</span>
            </a>
            <a class="nav-item" th:classappend="${active == 'cart'} ? ' active'" th:href="@{/cart}">
                <span class="ico">🛒</span>
                <span>购物车</span>
            </a>
            <a class="nav-item" th:classappend="${active == 'orders'} ? ' active'" th:href="@{/orders}">
                <span class="ico">📋</span>
                <span>我的订单</span>
            </a>
        </th:block>
    </nav>
    <div class="sidebar-footer">
        <span th:if="${loginUser != null and loginUser.admin}">Fruit Sales System<br>v1.0 · Spring Boot 3.5</span>
        <span th:if="${loginUser != null and !loginUser.admin}">鮮果商城<br>Happy Fruiting · v1.0</span>
    </div>
</aside>

<!-- ============ 顶部栏 ============ -->
<header class="topbar" th:fragment="topbar(title, subtitle)">
    <div class="page-title">
        <span th:text="${title}">标题</span>
        <small th:if="${subtitle}" th:text="${subtitle}"></small>
    </div>
    <div class="user-box">
        <div class="avatar" th:text="${loginUser != null ? #strings.substring(loginUser.username,0,1) : '?'}">A</div>
        <div class="user-meta">
            <div class="name" th:text="${loginUser != null ? loginUser.username : ''}">用户</div>
            <div class="role" th:text="${loginUser != null and loginUser.admin} ? '系统管理员' : '普通用户'">角色</div>
        </div>
        <form th:action="@{/logout}" method="post" class="inline-form">
            <button type="submit" class="btn-logout">退出</button>
        </form>
    </div>
</header>

</body>
</html>
